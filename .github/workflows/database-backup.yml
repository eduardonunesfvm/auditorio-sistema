name: Backup do PostgreSQL

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres-restore:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-test-password
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d restore_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_PUBLIC_URL: ${{ secrets.RAILWAY_DATABASE_PUBLIC_URL }}
      RESTORE_DATABASE_URL: postgresql://postgres:restore-test-password@localhost:5432/restore_test

    steps:
      - name: Validar configuracao
        shell: bash
        run: |
          if [ -z "$DATABASE_PUBLIC_URL" ]; then
            echo "Secret RAILWAY_DATABASE_PUBLIC_URL nao configurado."
            exit 1
          fi

      - name: Gerar dump portatil
        id: dump
        shell: bash
        run: |
          filename="auditorio-$(date -u +'%Y-%m-%d_%H%M%S').dump"
          pg_dump \
            --format=custom \
            --no-owner \
            --no-acl \
            --dbname="$DATABASE_PUBLIC_URL" \
            --file="$filename"
          sha256sum "$filename" > "$filename.sha256"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Testar restauracao completa
        shell: bash
        run: |
          pg_restore \
            --clean \
            --if-exists \
            --no-owner \
            --no-acl \
            --dbname="$RESTORE_DATABASE_URL" \
            "${{ steps.dump.outputs.filename }}"
          psql "$RESTORE_DATABASE_URL" --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.usuarios') IS NULL THEN
              RAISE EXCEPTION 'Tabela usuarios ausente no backup restaurado';
            END IF;
            IF to_regclass('public.agendamentos') IS NULL THEN
              RAISE EXCEPTION 'Tabela agendamentos ausente no backup restaurado';
            END IF;
          END;
          $$;
          SQL

      - name: Armazenar backup fora do Railway
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.filename }}
          path: |
            ${{ steps.dump.outputs.filename }}
            ${{ steps.dump.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Notificar falha por issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Alerta] Falha no backup diario do PostgreSQL";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `O backup falhou em ${new Date().toISOString()}. [Ver execucao](${runUrl}).`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
